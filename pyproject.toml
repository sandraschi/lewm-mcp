[project]
name = "lewm-mcp"
version = "0.2.1"
description = "FastMCP 3.2 server for LeWorldModel (LeWM): JEPA train/infer, planning hooks, agentic prep, fleet webapp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.35.0",
    "httpx>=0.28.0",
    "structlog>=24.0.0",
]
[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio", "httpx"]
dev = ["ruff>=0.16.0,<0.17", "mypy"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501"]
[tool.ruff.format]
quote-style = "double"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.0,<0.17",
]
